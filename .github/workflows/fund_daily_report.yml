name: Fund Daily Report

on:
  schedule:
    # 北京时间 工作日 09:00 (UTC+8) = UTC 01:00
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

jobs:
  push_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install akshare requests pandas

      - name: Make dir and run report
        run: |
          mkdir -p logs
          python3 query_fund.py
